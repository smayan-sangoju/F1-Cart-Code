<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background pill -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- F1 text -->
  <text x="10" y="46" font-family="system-ui, sans-serif" font-weight="900"
        font-size="36" fill="url(#g)" letter-spacing="-2">F1</text>
  <!-- Underline accent -->
  <rect x="10" y="50" width="44" height="3" rx="1.5" fill="url(#g)"/>
</svg>
